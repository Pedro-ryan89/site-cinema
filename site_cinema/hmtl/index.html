<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Cinefilmes</title>
</head>
<body>
    <!-- Cabeçalho com logotipo e barra de navegação -->
    <header>
        <nav class="container_nav">
            <!-- Logotipo -->
            <h2>Cinefilmes</h2>
            <!-- Barra de navegação -->
            <nav>
                <ul>
                    <!-- Links de navegação -->
                    <li><a href="#">Filmes em cartaz</a></
                </ul>
            </nav>
        </nav>
    </header>
    <!-- Seção de carrossel com uma imagem -->
    <section class="carrossel">
        <img src="/img/carrossel.jpg" alt="">
    </section>
    <!-- Seção principal -->
    <main>
        <section class="notificacao">
            <section class="titulo">
                <p>PRÉ-VENDA</p>
            </section>
            <p>ASSISTA A MARVELS</p>
            <a href="filme.html?filme=6"><img src="/img/filmes_templates/as-marvels_42247_home.jpg" alt=""></a>
            <section class="hover">
            </section>
        </section>
        <section class="notificacao segunda">
            <section class="titulo">
                <p>NACIONAL</p>
            </section>
            <p>ASSISTA A MUSSUM</p>
            <a href="filme.html?filme=5"><img src="/img/filmes_templates/mussum-o-filmis_46539_home.jpg" alt=""></a>
            <section class="hover">
            </section>
        </section>
        
        <!-- Título "Em cartaz" -->
        <h1>Em cartaz</h1>
        <!-- Seção de filmes -->
        <section class="filmes">
            <!-- Imagens de filmes com links para páginas específicas -->
            <a href="filme.html?filme=0"><img src="/img/filmes_templates/five-nights-at-freddys-o-pesadelo-sem-fim_46543_home.jpg" alt=""></a>
            <a href="filme.html?filme=1"><img src="/img/filmes_templates/o-exorcista-o-devoto_46537_home.jpg" alt=""></a>
            <a href="filme.html?filme=2"><img src="/img/filmes_templates/oppenheimer_39761_home.jpg" alt=""></a>
            <a href="filme.html?filme=3"><img src="/img/filmes_templates/patrulha-canina-um-filme-superpoderoso_43279_home.jpg" alt=""></a>
            <a href="filme.html?filme=4"><img src="/img/filmes_templates/trolls-3-juntos-novamente_40025_home.jpg" alt=""></a>
            <a href="filme.html?filme=5"><img src="/img/filmes_templates/mussum-o-filmis_46539_home.jpg" alt=""></a>
            <!-- Filmes em pré-venda com borda especial -->
            <article class="filme-estreia">
                <a href="filme.html?filme=6"><img class="filme-imagem" src="/img/filmes_templates/as-marvels_42247_home.jpg" alt=""></a>
                <div class="filme-botao">PRÉ VENDA</div>
            </article>
            <article class="filme-estreia">
                <a href="filme.html?filme=7"><img class="filme-imagem" src="/img/filmes_templates/jogos-vorazes-a-cantiga-dos-passaros-e-das-serpentes_28791_home.jpg" alt=""></a>
                <div class="filme-botao">PRÉ VENDA</div>
            </article>
        </section>
    </main>
</body>
</html>
